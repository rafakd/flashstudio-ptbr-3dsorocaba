name: Gerar instalador 3D Sorocaba

# Confere todo dia se a 3D Brasília publicou versão nova do Flash Studio PT-BR.
# Se houver, aplica a marca 3D Sorocaba, compila e publica uma release aqui.
on:
  schedule:
    - cron: '17 9 * * *'   # 06:17 em Brasília/Sorocaba
  workflow_dispatch:
    inputs:
      force:
        description: 'Gerar mesmo se a versão já existir (substitui a release)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-sorocaba
  cancel-in-progress: false

env:
  UPSTREAM: lexone/flashstudio_ptbr

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar este repositório
        uses: actions/checkout@v4

      - name: Descobrir a última versão do original
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          echo "Versão original mais recente: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git clone --depth 1 --branch "$tag" "https://github.com/$UPSTREAM.git" upstream

      - name: Aplicar marca 3D Sorocaba
        id: brand
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python branding/apply_branding.py upstream "$GITHUB_REPOSITORY"

      - name: Verificar se esta versão já foi publicada
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.brand.outputs.version }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "${{ inputs.force }}" = "true" ]; then
              gh release delete "$tag" --yes --cleanup-tag
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release $tag já existe. Nada a fazer."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar
        if: steps.check.outputs.skip == 'false'
        shell: powershell
        run: .\upstream\build.ps1

      - name: Empacotar código-fonte (AGPL)
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: |
          Move-Item upstream\dist out
          Remove-Item -Recurse -Force upstream\.git -ErrorAction SilentlyContinue
          Compress-Archive -Path upstream\* -DestinationPath codigo-fonte.zip

      - name: Publicar release
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.check.outputs.tag }}"
          up="${{ steps.upstream.outputs.tag }}"
          notes="Flash Studio PT-BR — versão 3D Sorocaba.

          Baseada na versão $up do projeto original de lexone / 3D Brasília (https://github.com/$UPSTREAM), licença AGPL-3.0.
          Código-fonte completo desta versão: codigo-fonte.zip

          Baixe **3D-Sorocaba-Flash-Studio-PTBR.exe**, feche o Flash Studio e execute."
          gh release create "$tag" \
            out/3D-Sorocaba-Flash-Studio-PTBR.exe \
            out/3D-Sorocaba-Flash-Studio-PTBR.exe.sha256 \
            codigo-fonte.zip \
            --title "3D Sorocaba – Flash Studio PT-BR $tag" \
            --notes "$notes" --latest
